[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "data",
    "notebooks",
    "outputs",
    "venv",
]

[tool.ruff.lint]
# Start with correctness-focused rules. Style rules can be introduced after
# the existing modules have been formatted in a dedicated change.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "auto"
